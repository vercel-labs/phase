pre-commit:
  parallel: true
  commands:
    format:
      glob: '**/*.{ts,tsx,json,jsonc,md}'
      # Generated files are formatted + staged by skill-sync (which runs in
      # parallel); excluding them here avoids a read-during-write race. CI's
      # repo-wide `pnpm format` still verifies them. The evals dir mirrors the
      # .oxfmtrc.json ignore (frozen fixtures); without the exclusion, a commit
      # staging only evals files hands oxfmt zero targets and it exits 2.
      exclude:
        - 'skills/phase/metadata.json'
        - 'packages/skill/evals/**'
      run: pnpm oxfmt --check {staged_files}
    lint:
      glob: '**/*.{ts,tsx}'
      run: pnpm oxlint {staged_files}
    # Regenerate metadata.json + the downloadable zip whenever skill sources
    # change, then stage the regenerated outputs into the same commit.
    # `git add` is explicit (not stage_fixed) because the outputs are not part
    # of the originally-staged set, so stage_fixed would leave them unstaged and
    # force a follow-up commit. Both outputs are deterministic — no spurious
    # churn. Runs only when a skill source or its maintainer tooling is staged.
    skill-sync:
      glob: '{skills/phase/**/*,packages/skill/**/*}'
      run: pnpm skill:package && git add skills/phase/metadata.json skills/phase/scripts/scan.mjs skills/phase/references/audit.md skills/phase/dist/phase-skill.zip
