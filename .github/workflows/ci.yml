name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress PR runs on new pushes; let main runs finish so the
# release workflow's history stays uninterrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: README bundle-size freshness
        run: |
          pnpm size:readme
          git diff --exit-code README.md \
            || (echo "README bundle-size table is stale. Run 'pnpm size:readme' and commit the result." && exit 1)

      - name: Unit tests
        run: pnpm test

      - name: Skill coverage
        run: pnpm skill:check

      - name: Skill artifact freshness
        run: |
          pnpm skill:build
          pnpm skill:package
          git diff --exit-code skills/phase/AGENTS.md skills/phase/metadata.json skills/phase/dist/phase-skill.zip \
            || (echo "Skill artifacts are stale. Run 'pnpm skill:build && pnpm skill:package' and commit the result." && exit 1)
