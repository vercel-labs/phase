name: CI

on:
  # Every open PR, not just those targeting main, so stacked PRs get a signal
  # before the branch below them merges. Base-relative steps stay correct: the
  # release-intent check diffs against the PR's own base.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancel in-progress PR runs on new pushes; let main runs finish so the
# release workflow's history stays uninterrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fdbc4fdcf7d143a5d0a39e9a02e103b13e309024 # v6.0.4
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Package release intent
        run: node scripts/check-package-version.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Build, typecheck, test, and size
        run: pnpm exec turbo run build typecheck test size

      - name: Check examples manifest
        run: |
          pnpm --filter @usephase/examples generate-manifest
          git diff --exit-code packages/examples/manifest.ts \
            || (echo "packages/examples/manifest.ts is out of date. Run 'pnpm --filter @usephase/examples generate-manifest' and commit the updated file." && exit 1)

      - name: README bundle-size freshness
        run: |
          pnpm size:readme
          git diff --exit-code README.md \
            || (echo "README bundle-size table is stale. Run 'pnpm size:readme' and commit the result." && exit 1)

      - name: Skill coverage
        run: pnpm skill:check

      - name: Skill artifact freshness
        run: |
          pnpm skill:package
          git diff --exit-code skills/phase/metadata.json skills/phase/scripts/scan.mjs skills/phase/references/audit.md skills/phase/dist/phase-skill.zip \
            || (echo "Skill artifacts are stale. Run 'pnpm skill:package' and commit the result." && exit 1)

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@fdbc4fdcf7d143a5d0a39e9a02e103b13e309024 # v6.0.4
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter phase exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: pnpm test:browser
